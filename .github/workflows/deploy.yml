name: CI/CD Pipeline (Build Docker & Deploy to VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: 🏗️ Build and push Docker image (with GitHub Actions cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: 🚀 Deploy to VPS (Fast Pull & Run)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH to VPS and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [1/3] Cập nhật repository tại /var/www/dect_project..."
            cd /var/www/dect_project
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [2/3] Kéo Docker image mới nhất từ GHCR..."
            docker pull ghcr.io/dewey97/dect_project:latest

            echo "⚡ [3/3] Khởi chạy container..."
            docker compose up -d --force-recreate --remove-orphans

            for net in traefik coolify dokploy caddy web gateway; do
              if docker network ls --format '{{.Name}}' | grep -qw "$net"; then
                echo "Kết nối container vào network $net..."
                docker network connect "$net" dect_project_app 2>/dev/null || true
              fi
            done


            echo "🧹 Dọn dẹp images cũ..."
            docker image prune -f

            echo "✅ Triển khai hoàn tất! Kiểm tra container:"
            docker compose ps


name: CI/CD Pipeline (Build Docker & Deploy to VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: 🏗️ Build and push Docker image (with GitHub Actions cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: 🚀 Deploy to VPS (Fast Pull & Run)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 SSH to VPS and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [1/3] Cập nhật repository tại /var/www/dect_project..."
            cd /var/www/dect_project
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [2/3] Kéo Docker image mới nhất từ GHCR..."
            docker pull ghcr.io/dewey97/dect_project:latest

            echo "⚡ [3/3] Khởi chạy container..."
            docker compose up -d --force-recreate --remove-orphans

            echo "🧹 Dọn dẹp images cũ..."
            docker image prune -f

            echo "🌐 [4/4] Cấu hình Reverse Proxy & SSL cho xplore.vn..."
            # 1. Tìm và cập nhật Caddyfile nếu có Caddy
            CADDY_FILES=$(find /etc /var /opt /root -name "Caddyfile" 2>/dev/null || true)
            for cfile in $CADDY_FILES; do
              echo "Tìm thấy Caddyfile tại: $cfile"
              if ! grep -q "xplore.vn" "$cfile"; then
                echo -e "\nxplore.vn, www.xplore.vn {\n    reverse_proxy 127.0.0.1:3000\n}" >> "$cfile"
                echo "Đã thêm xplore.vn vào $cfile"
              fi
            done
            if systemctl is-active --quiet caddy; then
              systemctl reload caddy || systemctl restart caddy || true
            fi
            # 2. Cấu hình Nginx nếu có
            if command -v nginx &> /dev/null || systemctl is-active --quiet nginx; then
              cat << 'EOF' > /etc/nginx/sites-available/xplore.vn
server {
    listen 80;
    server_name xplore.vn www.xplore.vn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOF
              mkdir -p /etc/nginx/sites-enabled
              ln -sf /etc/nginx/sites-available/xplore.vn /etc/nginx/sites-enabled/
              nginx -t && (systemctl reload nginx || nginx -s reload) || true
              if command -v certbot &> /dev/null; then
                certbot --nginx -d xplore.vn -d www.xplore.vn --non-interactive --agree-tos --register-unsafely-without-email || true
              fi
            fi

            echo "✅ Triển khai hoàn tất! Kiểm tra container:"
            docker compose ps

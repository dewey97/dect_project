# ---------------------------------------------------------------- BƯỚC 0: Ý TƯỞNG MỞ
# Tự do. Bung 3-5 premise, mỗi cái một cấu trúc khác nhau (library/skeletons.md).
ideas:
  seed: >
    Tàu đêm đang chạy. Khoang 4 giường nằm mềm, 1 người chết. Ngoài 4 người trong khoang
    còn vài người ra vào (tiếp viên toa, xe đẩy bán hàng, khách khoang bên, người lên ở ga giữa).
    Độ khó vừa (3/5).
  setting_facts_to_verify: # kiểm ở Bước 1 trước khi viết timeline
    - "Giờ tàu SE Hà Nội – Sài Gòn qua các ga và đoạn đèo Hải Vân (giờ tàu thật của năm chọn)"
    - "Đoạn đường sắt qua đèo Hải Vân có nhiều hầm ngắn, mất sóng điện thoại từng đoạn"
    - "Vé tàu ghi họ tên + số giấy tờ; khách tự đổi giường trong khoang không qua nhà ga"
    - "Khoang có chốt trong; tiếp viên toa giữ chìa mở khoang"
  premises:
    - id: P1
      title: "Giường số 3"
      skeleton: "Hai lớp sự thật"
      victim: "Ông Lâm, 68 tuổi, khách giường tầng trên số 4"
      culprit: "Người đàn ông giường số 2"
      motive: >
        Hung thủ định giết người đứng tên giường 3 (một nữ kiểm toán sắp tố cáo hắn).
        Trước đó bà xin đổi giường với ông Lâm vì ông lớn tuổi không trèo lên tầng trên được.
        Hung thủ ra tay trong bóng tối, giết nhầm ông Lâm.
      twist: "Nạn nhân chết vì một lần đổi giường. Người chơi tìm kẻ thù của ông Lâm và không thấy ai đủ động cơ."
      why_suspect_wrong_person: >
        Con gái ông Lâm (khoang bên) có tranh chấp tiền với bố, ra vào khoang nhiều lần trong đêm.
      layer_2_reveal: "Vé tàu và danh sách khách lệch với người nằm thực tế, kéo theo câu hỏi: ai là mục tiêu thật?"

    - id: P2
      title: "Tin nhắn sau hầm"
      skeleton: "Xoắn ốc"
      victim: "Chị Trâm, 34 tuổi, chủ chuỗi spa"
      culprit: "Chồng sắp cưới của Trâm, nằm cùng khoang"
      motive: "Trâm phát hiện anh ta lừa tiền và định hủy hôn khi xuống ga Đà Nẵng."
      twist: >
        Tin nhắn "Em ngủ đây, mai gặp" gửi đi lúc 03:12 khiến mọi người tin Trâm còn sống sau hầm.
        Thực ra hung thủ soạn tin trên máy Trâm trong đoạn mất sóng lúc 02:40. Tin nằm chờ và tự gửi
        khi tàu ra khỏi hầm. Lúc 03:12 hung thủ đang ngồi ở toa ăn có người làm chứng.
      why_suspect_wrong_person: "Người phụ nữ giường đối diện có mâu thuẫn làm ăn với Trâm, và thức cả đêm."
      spiral: "Mỗi vòng thẩm tra chồng sắp cưới lộ một lớp: nói dối giờ ngủ → nói dối chuyện tiền → nói dối chuyện điện thoại."

    - id: P3
      title: "Ga Đông Hà, 4 phút"
      skeleton: "Đếm ngược"
      victim: "Ông Phát, chủ thầu xây dựng"
      culprit: "Một người không có vé khoang này: lên tàu ở ga trước, giả làm nhân viên xe đẩy"
      motive: "Trả thù cho người anh chết trong vụ sập giàn giáo công trình của ông Phát."
      twist: "Hung thủ không phải ai trong 4 người khoang. Hắn sẽ xuống ở ga kế tiếp. Người chơi phải chỉ ra hắn và ga hắn xuống trước khi tàu đến đó."
      why_suspect_wrong_person: "Thư ký của ông Phát nằm cùng khoang, giữ két tiền và nói dối về giờ đi vệ sinh."
      needs_dev_hint: "Không cần đồng hồ thật; mốc ga là áp lực trong truyện. Đáp án cuối = tên + ga xuống."

    - id: P4
      title: "Người con nhận tội"
      skeleton: "Ngược dòng"
      victim: "Bà Hạnh, 60 tuổi, bị bệnh tim"
      culprit: "Con dâu, nằm giường dưới đối diện"
      motive: "Bà Hạnh định sửa di chúc, gạch tên vợ chồng con trai trong lần lên Sài Gòn gặp luật sư."
      twist: "Con trai bà tự nhận ngay đã đổi thuốc tim của mẹ. Câu hỏi không phải 'ai' mà là 'anh ta đang che cho ai, và vì sao lời tự thú sai một chi tiết'."
      why_suspect_wrong_person: "Lời tự thú có sẵn, người chơi dễ chấp nhận ngay."

    - id: P5
      title: "Không ai giết ông Toàn"
      skeleton: "Không có tội phạm"
      victim: "Ông Toàn, 55 tuổi, chết do đột quỵ lúc 01:30"
      culprit: "none (chết tự nhiên). Người dàn dựng: em vợ ông, cùng khoang"
      motive: "Em vợ dàn hiện trường thành án mạng để đổ tội cho tình nhân của ông Toàn ở khoang bên, giành phần thừa kế cho chị gái."
      twist: "Không có án mạng; có một tội khác (dàn dựng, vu khống) che sau."
      why_suspect_wrong_person: "Tình nhân có dấu vân tay và vết son trên cốc của ông Toàn."
      needs_dev_hint: "Kết luận cần cho phép đáp án 'không có hung thủ' + chỉ ra người dàn dựng."
  recommendation: "P1, ghép thêm cơ chế tin nhắn chờ sau hầm của P2 làm ngoại phạm giả cho hung thủ"
  chosen: "P1 + P2: giết nhầm do đổi giường, ngoại phạm bằng tin nhắn tự gửi khi tàu ra khỏi hầm"

# ---------------------------------------------------------------- BƯỚC 1: PREMISE
meta:
  slug: case_001
  title: "Đổi Giường"
  synopsis: >
    Rạng sáng 18/10/2025, tàu Thống Nhất vào ga Đà Nẵng sau khi vượt đèo Hải Vân trong mưa.
    Ở khoang số 5 toa 7, ông Lâm, 68 tuổi, nằm chết trên giường dưới. Ông không có kẻ thù nào
    đủ để giết mình. Cả ba người cùng khoang đều nói đêm đó họ ngủ say.
  difficulty: 3
  duration_minutes: 30
  setting:
    city: "Tàu Thống Nhất chiều Bắc – Nam, đoạn Huế – Đà Nẵng"
    main_location: khoang_5_toa_7
    date: "2025-10-17" # tối thứ Sáu 17/10, án mạng rạng sáng thứ Bảy 18/10 (đã kiểm)
    weekday: "Thứ Sáu (đêm sang thứ Bảy)"
    season_notes: >
      Giữa mùa mưa miền Trung. Đèo Hải Vân mưa và sương mù về đêm. Tàu chạy chậm qua đèo.
    train: >
      Số hiệu hư cấu SE31 (không dùng số hiệu tàu thật để tránh lệch giờ tàu thật).
      Giờ chạy hư cấu nhưng khớp thời gian thật của đoạn Huế – Đà Nẵng (103 km, 2,5–4 giờ).
  axes:
    case_type: "Án mạng"
    skeleton: "Hai lớp sự thật" # lớp 1: ai muốn giết ông Lâm? lớp 2: ông Lâm không phải mục tiêu
    culprit_count: 1
    twist: ["Giết nhầm người (đổi giường)", "Thời điểm giả (tin nhắn chờ gửi sau hầm)"]
    false_alibi: ["Tin nhắn hẹn giờ ngầm do mất sóng", "Nhân chứng tiếp viên toa (thật nhưng sau giờ chết)"]
    opening_gate: "Đọc hiện trường: ai nằm giường nào"
    tone: "Hồ sơ lạnh, không gian kín, mưa đêm"
    main_clue_source: "Điện thoại nạn nhân + danh sách hành khách + lời khai"
  diff_from_previous: # luật chống nhàm, so với case_000
    - "Cấu trúc: Hai lớp sự thật (case_000: Phễu loại trừ)"
    - "Twist: Giết nhầm + Thời điểm giả (case_000: Mồi nhử + Hai bàn tay)"
    - "Ngoại phạm giả: tin nhắn chờ gửi (case_000: âm thanh nền + lịch TV)"
    - "Cửa mở đầu: đọc hiện trường (case_000: tra SĐT)"
    - "Bối cảnh: không gian kín đang di chuyển, 2025 (case_000: xóm ven sông, 2016)"
  player_role: >
    Bạn là điều tra viên đang nghỉ phép, đi toa 8 cùng chuyến. 03:50 trưởng tàu nhờ bạn giúp
    trong lúc chờ công an ga Đà Nẵng (trực đêm, 05:00 mới đến).
  deadline: >
    05:00. Tàu chỉ được giữ ở ga Đà Nẵng đến lúc công an đến. Khải, Tú và Ngân có vé đến Đà Nẵng;
    nếu chưa chỉ ra hung thủ, họ được rời tàu.
  available_tools:
    - "Hỏi chuyện từng người (lời kể, nói lại)"
    - "Xem điện thoại nạn nhân; điện thoại của người tự nguyện đưa"
    - "Sổ giao ca, danh sách khách, lịch chạy tàu (qua trưởng tàu)"
    - "Trưởng tàu gọi trung tâm bán vé tra thông tin vé"
    - "Bác sĩ đi cùng chuyến khám sơ bộ"
    - "Kiểm tra tay, đồ đạc khi người đó đồng ý hoặc trưởng tàu yêu cầu"
  ui_labels:
    interrogation: "Hỏi chuyện"
    motive: "Động cơ"
    contradiction: "Chỗ vênh"
    statement: "Lời kể"
    indictment: "Chỉ mặt hung thủ"
  breaks:
    - { rule: "Vật chứng giám định (ADN, xét nghiệm)", reason: "Phá án trên tàu trong 70 phút; chỉ dùng thứ quan sát được tại chỗ" }
  needs_dev:
    - { mechanic: "ui_labels", why: "Chữ Thẩm tra / Lời khai / Kết luận đang viết cứng trong giao diện; vụ này cần Hỏi chuyện / Lời kể / Chỉ mặt hung thủ" }
  status: draft

truth:
  victim: lam
  culprit: khai
  intended_victim: ngan # người hung thủ thật sự muốn giết
  motive: >
    Khải (giám đốc tài chính một công ty xây dựng) biết Ngân (kiểm toán viên) mang theo bằng chứng
    hắn rút ruột 14 tỷ đồng, sáng 18/10 sẽ nộp cho đoàn thanh tra ở Đà Nẵng. Hắn mua vé cùng khoang
    để giết cô trên tàu, lấy lại ổ cứng.
  motive_code: silence-witness
  method: >
    Khoảng 02:35, khi tàu chạy trong các hầm qua đèo (tối, ồn), Khải dùng gối bịt mũi miệng người
    nằm giường số 1, tin đó là Ngân (khăn quàng đỏ của Ngân còn để quên trên móc giường 1, người nằm trùm chăn kín đầu vì điều hòa lạnh). Người đó là ông Lâm: lúc 22:40, khi Khải đang ở toa ăn,
    Ngân đã đổi giường số 1 (dưới) cho ông Lâm vì ông không trèo lên giường số 3 (trên) được.
  weapon_evidence: "" # gối; chọn mã ở Bước 3
  death_window: { from: "02:00", to: "03:00", best_estimate: "02:35" }
  fake_time_trick: >
    Sau khi giết, Khải cầm chiếc điện thoại không khóa trên gối giường 1 (tưởng của Ngân), mở cuộc
    trò chuyện gần nhất, gõ "Em ngủ đây, mai nói chuyện nhé" rồi bấm gửi. Tàu đang trong hầm nên tin
    nằm chờ. Khải ra phòng trực đầu toa 7 xin nước nóng lúc 02:50, ngồi nói chuyện với tiếp viên Sơn đến 03:15. Tàu ra khỏi hầm cuối lúc 03:05, tin tự gửi đi. Lúc đó Khải đang
    ngồi trước mặt tiếp viên Sơn. Nhưng điện thoại là của ông Lâm, cuộc trò chuyện gần nhất là với
    con gái ông, nên tin nhắn từ bố gửi con gái lại xưng "em".
  twist: >
    Lớp 1: người chơi tìm kẻ muốn giết ông Lâm. Con gái ông có tranh chấp tiền, cậu thanh niên giường 4
    lấy trộm tiền của ông trong đêm, nhưng không ai đủ động cơ và thời cơ. Lớp 2: tin nhắn xưng "em"
    và việc đổi giường cho thấy hung thủ nhắm người khác. Mục tiêu thật là Ngân, chính người phát hiện
    thi thể.
  backstory: >
    Ngân làm kiểm toán độc lập cho công ty của Khải, phát hiện hợp đồng khống. Hai ngày trước,
    Ngân báo sẽ gặp thanh tra ở Đà Nẵng. Khải mua vé ngay sau đó, chọn đúng khoang của Ngân.
  weak_point_fixes: # đã duyệt ở cổng Bước 1
    - "Không nhận ra ông già: khăn đỏ của Ngân để quên ở giường 1, nạn nhân trùm chăn kín đầu, khoang tối khi tàu trong hầm"
    - "Ngân không thức: tàu trong hầm rất ồn; ông Lâm uống thuốc ngủ nhẹ Thảo đưa lúc 23:10 nên vùng vẫy yếu (thuốc này cũng là mồi nghi Thảo đầu độc)"
    - "Ngoại phạm: phòng trực tiếp viên đầu toa thay cho toa ăn (toa ăn mở lúc 3 giờ sáng chưa chắc đúng thực tế)"
  discovery: >
    03:40 tàu vào ga Đà Nẵng. Ngân trèo xuống để chuẩn bị xuống tàu, phát hiện ông Lâm không thở,
    gọi tiếp viên toa. Tàu được giữ lại ở ga. Công an ga trực đêm 05:00 mới đến; trưởng tàu nhờ người chơi (điều tra viên nghỉ phép, toa 8) giúp trong lúc chờ.
  cast_draft: # chi tiết ở Bước 2
    - { key: lam, role: victim, note: "Ông Lâm, 68 tuổi, hưu trí. Vé giường 3, ngủ giường 1. Điện thoại không đặt mật khẩu" }
    - { key: ngan, role: suspect, note: "Ngân, 31 tuổi, kiểm toán viên. Vé giường 1, ngủ giường 3. Mục tiêu thật. Người phát hiện thi thể" }
    - { key: khai, role: suspect, note: "Khải, 45 tuổi, giám đốc tài chính. Giường 2. Hung thủ" }
    - { key: tu, role: suspect, note: "Tú, 24 tuổi, thợ điện. Giường 4. Lấy trộm tiền ông Lâm lúc 01:50; nói dối là ngủ suốt" }
    - { key: thao, role: suspect, note: "Thảo, 40 tuổi, con gái ông Lâm, khoang bên. Tranh chấp tiền bán nhà; vào khoang đưa thuốc cho bố lúc 23:10" }
    - { key: tiep_vien, role: witness, note: "Tiếp viên toa 7. Giữ chìa khoang. Giúp ông Lâm chuyển hành lý khi đổi giường lúc 22:40. Làm chứng Khải ngồi ở phòng trực 02:50–03:15" }
  status: draft


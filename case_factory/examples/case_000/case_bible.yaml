# Các điểm đã sửa so với tài liệu cũ: xem DECISIONS.md cùng thư mục.
# Mã vật chứng: A = hồ sơ ban đầu, H = hiện trường, B, C, TT, E, F, K = các bộ mở dần.
# Không dùng tiền tố D-, T-, S- cho vật chứng (trùng mã suy luận, sự kiện, lời khai).

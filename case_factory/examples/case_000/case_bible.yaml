# ---------------------------------------------------------------- BƯỚC 1: PREMISE
meta:
  slug: case_000
  title: "Trốn Tìm"
  synopsis: >
    Sáng 25/07/2016, Nguyễn Văn Khang, chủ cho vay nặng lãi ở xóm Bờ Sông, được phát hiện
    tử vong trong phòng khách. Đêm trước, bốn người quen cũ lần lượt ghé nhà anh ta.
    Ai cũng có lý do, và ai cũng nói dối một điều gì đó.
  difficulty: 3
  duration_minutes: 30
  setting:
    city: "Hà Nội (hư cấu)"
    main_location: home_khang
    date: "2016-07-24"
    weekday: "Chủ nhật" # đã kiểm: 24/07/2016 là Chủ nhật
    season_notes: >
      Giữa hè, nóng ẩm, trời tối khoảng 19:15. Tháng 7 là mùa hoa bằng lăng tím nở rộ;
      hoa xoan đã tàn từ tháng 4 (vì vậy dấu vết thực vật là cánh hoa bằng lăng).
  status: approved

truth:
  victim: khang
  culprit: ha
  motive: >
    Hà yêu Khang mù quáng. Khi Khang bất tỉnh, Hà mở điện thoại của anh ta và đọc được
    tin nhắn Khang hẹn bỏ trốn vào Đà Lạt với Thảo Vy chuyến bay 06:15 sáng hôm sau.
  motive_code: romantic-jealousy
  method: >
    Dùng mảnh thủy tinh của bình trà vỡ (vỡ từ lúc Tùng xô xát) cứa đứt động mạch cảnh
    của Khang đang bất tỉnh, rồi cắt một lọn tóc mai bên trái mang đi.
  weapon_evidence: H-03
  death_window: { from: "20:45", to: "21:15", best_estimate: "21:00" }
  twist: >
    Tùng có động cơ mạnh nhất, nói dối là không đến và để lại vân tay, nên người chơi
    tưởng đã tìm ra hung thủ. Nhưng Tùng chỉ xô Khang ngất lúc 20:05 và rời đi 20:15;
    vết thương chí mạng xảy ra ~21:00. Hung thủ là người "hiền lành nhất" và có
    ngoại phạm trông chắc chắn nhất.
  backstory: >
    Chiều 24/07/1996, nhóm trẻ xóm Bờ Sông (Khang, Tùng, Hà, Mai, bé Nguyễn Gia Huy 7 tuổi,
    em trai Tùng, câm bẩm sinh và bị bệnh tim) chơi trốn tìm. Khang cài then sắt bên ngoài
    tủ gỗ lim nơi Huy trốn rồi bỏ đi. Huy chết ngạt. Vụ việc được khép là tai nạn.
    Hai ngày trước án mạng (22/07/2016), trong bữa nhậu xóm cũ, Khang say rượu khoe lại
    "chiến tích nhốt thằng câm trong tủ". Ngày án mạng là đúng ngày giỗ thứ 20 của Huy.
  status: approved


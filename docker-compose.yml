services:
  app:
    image: ghcr.io/dewey97/dect_project:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dect_project_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dect-http.rule=Host(`xplore.vn`) || Host(`www.xplore.vn`) || Host(`72.62.199.110`)"
      - "traefik.http.routers.dect-http.entrypoints=web"
      - "traefik.http.routers.dect-https.rule=Host(`xplore.vn`) || Host(`www.xplore.vn`)"
      - "traefik.http.routers.dect-https.entrypoints=websecure"
      - "traefik.http.routers.dect-https.tls=true"
      - "traefik.http.routers.dect-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dect-ip.rule=Host(`72.62.199.110`)"
      - "traefik.http.routers.dect-ip.entrypoints=websecure"
      - "traefik.http.routers.dect-ip.tls=true"
      - "traefik.http.services.dect-app.loadbalancer.server.port=3000"

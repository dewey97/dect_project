services:
  app:
    image: ghcr.io/dewey97/dect_project:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dect_project_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dect-http.rule=Host(`xplore.vn`) || Host(`www.xplore.vn`)"
      - "traefik.http.routers.dect-http.entrypoints=http"
      - "traefik.http.routers.dect-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.dect-https.rule=Host(`xplore.vn`) || Host(`www.xplore.vn`)"
      - "traefik.http.routers.dect-https.entrypoints=https"
      - "traefik.http.routers.dect-https.tls=true"
      - "traefik.http.routers.dect-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.dect-app.loadbalancer.server.port=3000"



